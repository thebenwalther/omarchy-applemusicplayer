name: Feature request
description: Suggest an improvement compatible with the web/MPRIS architecture
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What user need would this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the interaction and expected result.
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: Architecture fit
      options:
        - Uses existing Omarchy or MPRIS capabilities
        - Unsure
        - Would require an unsupported Apple-specific capability
    validations:
      required: true
  - type: checkboxes
    id: exclusions
    attributes:
      label: Project boundaries
      options:
        - label: This proposal does not require credentials, DOM scraping, a DRM bridge, or a background daemon.
          required: true
