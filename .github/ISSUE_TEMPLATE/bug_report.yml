name: Bug report
description: Report a reproducible problem with the widget, installer, or launcher
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include Apple credentials, browser profiles, tokens, or private keys.
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit SHA
      placeholder: v3.1.0
    validations:
      required: true
  - type: input
    id: omarchy
    attributes:
      label: Omarchy version
      placeholder: 4.0.1-1
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected behavior and exact reproduction steps.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant diagnostics
      description: Include sanitized QML warnings, hyprctl config errors, or test output.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed credentials and personal browser data.
          required: true
        - label: I searched existing issues for this problem.
          required: true
