<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Omarchy Apple Music player widget preview</title>
  <desc id="desc">A compact Apple Music bar pill and a rich now-playing popup with artwork, transport, volume, sleep timer, and source controls.</desc>
  <defs>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fa57c1"/><stop offset=".5" stop-color="#f43f5e"/><stop offset="1" stop-color="#ff8a3d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".4"/></filter>
  </defs>
  <rect width="960" height="640" fill="#0d1013"/>
  <rect x="0" y="0" width="960" height="48" fill="#171b20"/>
  <rect x="310" y="7" width="340" height="34" rx="17" fill="#272e36" stroke="#4b5662"/>
  <rect x="317" y="12" width="24" height="24" rx="6" fill="url(#art)"/>
  <path d="M332 17v11c0 4-6 5-7 1-1-3 3-5 6-3v-6l7-2v9c0 4-6 5-7 1" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <text x="352" y="22" fill="#f4f7fa" font-family="sans-serif" font-weight="700" font-size="12">Midnight Drive</text>
  <text x="352" y="35" fill="#9da7b2" font-family="sans-serif" font-size="10">The Satellites</text>
  <text x="627" y="29" fill="#ff5e87" font-family="sans-serif" font-size="14">Ⅱ</text>

  <g filter="url(#shadow)">
    <rect x="258" y="74" width="444" height="532" rx="16" fill="#171b20" stroke="#44505b"/>
    <rect x="278" y="94" width="404" height="148" rx="12" fill="#222830" stroke="#3d4853"/>
    <rect x="288" y="104" width="128" height="128" rx="12" fill="url(#art)"/>
    <path d="M366 127v58c0 20-28 22-31 6-3-13 13-22 28-14v-31l31-8v43c0 20-29 22-31 6-2-13 13-21 28-14v-55z" fill="white" opacity=".94"/>
    <circle cx="438" cy="122" r="4" fill="#ff5e87"/>
    <text x="450" y="126" fill="#ff718f" font-family="sans-serif" font-size="10" font-weight="700">NOW PLAYING · APPLE MUSIC</text>
    <text x="438" y="160" fill="#f4f7fa" font-family="sans-serif" font-size="20" font-weight="700">Midnight Drive</text>
    <text x="438" y="184" fill="#d8dde2" font-family="sans-serif" font-size="14">The Satellites</text>
    <text x="438" y="207" fill="#89939e" font-family="sans-serif" font-size="12">Neon Horizons</text>

    <rect x="278" y="262" width="404" height="5" rx="3" fill="#39424c"/>
    <rect x="278" y="262" width="146" height="5" rx="3" fill="#f2f5f7"/>
    <circle cx="424" cy="264.5" r="7" fill="#f2f5f7"/>
    <text x="278" y="284" fill="#8f99a4" font-family="sans-serif" font-size="10">1:42</text>
    <text x="660" y="284" fill="#8f99a4" font-family="sans-serif" font-size="10" text-anchor="end">4:36</text>

    <g fill="#eef2f5" font-family="sans-serif" text-anchor="middle">
      <text x="332" y="332" font-size="20">|◀</text><text x="388" y="332" font-size="15">−10</text>
      <circle cx="480" cy="323" r="31" fill="#343c46" stroke="#596572"/><text x="480" y="331" font-size="22">Ⅱ</text>
      <text x="572" y="332" font-size="15">+10</text><text x="628" y="332" font-size="20">▶|</text>
    </g>

    <text x="282" y="382" fill="#f1f4f6" font-family="sans-serif" font-size="18">🔊</text>
    <rect x="320" y="372" width="302" height="5" rx="3" fill="#3a434d"/><rect x="320" y="372" width="208" height="5" rx="3" fill="#f1f4f6"/><circle cx="528" cy="374.5" r="7" fill="#f1f4f6"/>
    <text x="674" y="380" fill="#bac2ca" font-family="sans-serif" font-size="11" text-anchor="end">69%</text>
    <line x1="278" y1="405" x2="682" y2="405" stroke="#313a43"/>

    <text x="278" y="432" fill="#8f99a4" font-family="sans-serif" font-size="10" font-weight="700">SLEEP TIMER</text>
    <text x="682" y="432" fill="#ff718f" font-family="sans-serif" font-size="10" text-anchor="end">Sleep in 29:48</text>
    <g font-family="sans-serif" font-size="11" text-anchor="middle">
      <rect x="278" y="445" width="54" height="32" rx="7" fill="#292f37"/><text x="305" y="465" fill="#eef2f5">15m</text>
      <rect x="338" y="445" width="54" height="32" rx="7" fill="#3b3038" stroke="#ff718f"/><text x="365" y="465" fill="#ff91a8">30m</text>
      <rect x="398" y="445" width="54" height="32" rx="7" fill="#292f37"/><text x="425" y="465" fill="#eef2f5">60m</text>
      <rect x="458" y="445" width="108" height="32" rx="7" fill="#292f37"/><text x="512" y="465" fill="#eef2f5">End of track</text>
      <rect x="572" y="445" width="54" height="32" rx="7" fill="#292f37"/><text x="599" y="465" fill="#eef2f5">Off</text>
    </g>

    <line x1="278" y1="497" x2="682" y2="497" stroke="#313a43"/>
    <rect x="278" y="514" width="404" height="42" rx="8" fill="#302b33" stroke="#ff718f"/>
    <text x="294" y="539" fill="#ff718f" font-family="sans-serif" font-size="12">Ⅱ</text>
    <text x="320" y="539" fill="#f4f7fa" font-family="sans-serif" font-size="12">Apple Music · Midnight Drive — The Satellites</text>
    <rect x="278" y="566" width="404" height="28" rx="8" fill="#242b32" stroke="#46515c"/>
    <text x="480" y="585" fill="#f4f7fa" font-family="sans-serif" font-size="12" text-anchor="middle">Open Apple Music</text>
  </g>
